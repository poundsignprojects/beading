<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Bead Pattern Designer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="library-view" hidden>
    <div id="library-header">
      <h1>Patterns</h1>
      <button id="library-new">+ New</button>
    </div>
    <ul id="library-list"></ul>
    <p id="library-empty-message" hidden>No patterns yet. Tap "+ New" to start one.</p>
  </div>

  <div id="editor-view" hidden>
    <div id="top-bar">
      <button id="back-to-library">&larr; Library</button>
      <select id="bead-type">
        <option value="delica11">Delica 11/0</option>
        <option value="rocaille11">Rocaille 11/0</option>
      </select>
      <label>Rows <input id="rows" type="number" value="20" min="1"></label>
      <label>Cols <input id="cols" type="number" value="20" min="1"></label>
      <button id="generate">Resize</button>
      <button id="unit-toggle">mm / in</button>
      <span id="size-readout"></span>
      <button id="reset-view">Reset View</button>
      <div id="history-controls" role="group" aria-label="History">
        <button id="undo-button" disabled>Undo</button>
        <button id="redo-button" disabled>Redo</button>
      </div>
      <button id="print-export">Print / Export</button>
      <button id="panel-toggle" aria-pressed="true">Panel</button>
    </div>
    <div id="editor-body">
      <div id="tool-rail" role="group" aria-label="Tools">
        <div id="tool-toggle" role="group" aria-label="Tool">
          <button id="tool-draw" aria-pressed="true">Draw</button>
          <button id="tool-erase" aria-pressed="false">Erase</button>
          <button id="tool-fill" aria-pressed="false">Fill</button>
          <button id="tool-replace" aria-pressed="false">Replace</button>
          <button id="tool-select" aria-pressed="false">Select</button>
        </div>
        <div id="selection-controls" role="group" aria-label="Selection">
          <button id="selection-copy" disabled>Copy</button>
          <button id="selection-cut" disabled>Cut</button>
          <button id="selection-paste" disabled>Paste</button>
          <button id="selection-mirror-h" disabled>Mirror &harr;</button>
          <button id="selection-mirror-v" disabled>Mirror &updownarrow;</button>
          <button id="selection-deselect" disabled title="Deselect (Esc)">Deselect</button>
        </div>
        <button id="clear-pattern">Clear</button>
      </div>
      <canvas id="pattern-canvas"></canvas>
      <div id="side-panel">
        <section id="palette-section" aria-label="Color palette">
          <div id="palette-section-header">
            <h2>Colors</h2>
            <button id="color-manage-toggle" type="button" aria-pressed="false">Manage</button>
          </div>
          <div id="color-palette" role="group" aria-label="Color"></div>
          <p id="color-palette-empty" hidden>No colors yet — tap + to add one.</p>
          <input type="color" id="color-picker-input" class="visually-hidden-input">
          <ul id="color-manage-list" hidden></ul>
        </section>
        <section id="colorway-section" aria-label="Colorway">
          <h2>Colorway</h2>
          <div id="colorway-controls" role="group" aria-label="Colorway">
            <select id="colorway-select"></select>
            <button id="colorway-new" title="New colorway">+</button>
            <button id="colorway-rename" title="Rename colorway">Rename</button>
            <button id="colorway-delete" title="Delete colorway">Delete</button>
          </div>
        </section>
        <section id="photo-trace-section" aria-label="Photo trace">
          <h2>Photo Trace</h2>
          <div id="photo-trace-controls" role="group" aria-label="Photo trace">
            <input type="file" id="photo-trace-file" accept="image/*" hidden>
            <button id="photo-trace-load">Load Photo</button>
            <label id="photo-trace-opacity-label" hidden>Opacity
              <input id="photo-trace-opacity" type="range" min="0" max="100" value="60">
            </label>
            <button id="photo-trace-move" aria-pressed="false" hidden>Move Photo</button>
            <button id="photo-trace-remove" hidden>Remove Photo</button>
          </div>
        </section>
      </div>
    </div>
  </div>

  <dialog id="resize-dialog">
    <form method="dialog" id="resize-form">
      <h2>Resize Pattern</h2>
      <p id="resize-warning" hidden></p>
      <fieldset id="resize-row-anchor" hidden>
        <legend>Add/remove rows on</legend>
        <label><input type="radio" name="row-side" value="right" checked> Right</label>
        <label><input type="radio" name="row-side" value="left"> Left</label>
        <label><input type="radio" name="row-side" value="both"> Both sides</label>
      </fieldset>
      <fieldset id="resize-col-anchor" hidden>
        <legend>Add/remove columns on</legend>
        <label><input type="radio" name="col-side" value="bottom" checked> Bottom</label>
        <label><input type="radio" name="col-side" value="top"> Top</label>
        <label><input type="radio" name="col-side" value="both"> Both sides</label>
      </fieldset>
      <div id="resize-actions">
        <button type="button" id="resize-cancel">Cancel</button>
        <button type="submit" id="resize-confirm">Resize</button>
      </div>
    </form>
  </dialog>

  <div id="print-view" hidden>
    <div id="print-toolbar">
      <button id="print-close">&larr; Close</button>
      <button id="print-now">Print</button>
    </div>
    <div id="print-content">
      <header id="print-header"></header>
      <section id="print-materials"></section>
      <section id="print-chart"></section>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
